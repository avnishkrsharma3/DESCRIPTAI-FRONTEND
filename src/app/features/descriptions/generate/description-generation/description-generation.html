<main class="page-container">
  @if (loading()) {
    <section class="state-card" role="status" aria-live="polite">
      <span class="loading-indicator" aria-hidden="true"></span>
      Generating descriptions and preparing your dashboard…
    </section>
  } @else if (error(); as message) {
    <section class="state-card error-state" role="alert">
      <h1>Generation failed</h1>
      <p>{{ message }}</p>
      <a routerLink="/products">Return to product catalog</a>
    </section>
  }
</main>
